# Deploy senda.network to Vercel on every push to main.
#
# Uses VERCEL_* repo secrets (token + org/project ids). This replaces the
# broken Vercel↔GitHub App link after the repo moved to senda-network/senda;
# no collaborator commits or public GitHub activity from the Vercel account.
#
# Builds on Vercel (not --prebuilt): local `vercel build` + `--prebuilt` was
# failing with ENOENT under node_modules/@opentelemetry/api during upload.

name: Vercel production deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'desktop/**'
      - 'internal/**'
      - '.agency/**'
      - 'programs/**'
      - 'tests/**'
      - 'Anchor.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tsconfig.anchor.json'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
