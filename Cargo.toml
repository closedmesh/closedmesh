[workspace]
members = [
    "programs/*"
]
# Desktop is its own Tauri crate (separate Cargo.lock / deps). The vault
# scaffold's root workspace must not claim it — otherwise `tauri build`
# dies with "current package believes it's in a workspace when it's not".
exclude = ["desktop"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
